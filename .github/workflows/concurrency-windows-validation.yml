name: Validate concurrency repair on Windows
on:
  push:
    branches: [validation/concurrency-windows-20261104]
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  project-metadata-locks:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install declared test dependencies
        run: python -m pip install -r config/requirements-dev.txt
      - name: Report actual platform and code identity
        run: |
          python -c "import platform,sys; print(platform.platform()); print(sys.version)"
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
      - name: Run lock and metadata regression tests
        run: >-
          python -B -m pytest -q -c config/pytest.ini
          scripts/tests/test_project_concurrency.py
          scripts/tests/test_artifact_runtime.py
          scripts/tests/test_project_state.py
          scripts/tests/test_candidate_test_mode.py
          scripts/tests/test_blender_previs_project.py
          scripts/tests/test_voice_reference_cli.py
