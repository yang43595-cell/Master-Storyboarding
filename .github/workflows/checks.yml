name: Repository checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    name: Python and Node checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
      HF_HUB_OFFLINE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Prepare local main reference for status checks
        run: |
          if ! git show-ref --verify --quiet refs/heads/main; then
            git branch main origin/main
          fi
          git merge-base HEAD main

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Create isolated Python environment
        run: |
          python -m venv "$RUNNER_TEMP/msb-venv"
          echo "$RUNNER_TEMP/msb-venv/bin" >> "$GITHUB_PATH"

      - name: Install locked dependencies
        run: |
          python -m pip install --index-url https://pypi.org/simple --require-hashes --only-binary=:all: -r config/requirements-dev.txt
          python -m pip check
          python -m pip install --dry-run --no-index -r config/requirements-dev.in
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Install synthetic media test prerequisite
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          command -v ffmpeg
          command -v ffprobe

      - name: Check bundled knowledge and CLI
        run: |
          python -m scripts.core.knowledge_runtime
          python scripts/stage_context_cli.py --help

      - name: Run synthetic Python regression
        run: |
          test_tmp=$(mktemp -d "$RUNNER_TEMP/msb-tests.XXXXXX")
          trap 'rm -rf -- "$test_tmp"' EXIT
          export TMPDIR="$test_tmp"
          python -m pytest -q -ra -c config/pytest.ini scripts/tests tests --basetemp="$test_tmp/pytest" -o cache_dir="$test_tmp/cache"

      - name: Run offline Node regression
        run: node --test scripts/tests/*.cjs
